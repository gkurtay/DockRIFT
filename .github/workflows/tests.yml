name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Doctor
        run: dockrift doctor

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build reproducible v1.0.0 release distributions
        run: |
          python -m pip install "pip==26.2.1" "setuptools==84.0.0"
          rm -rf build dist src/dockrift.egg-info .sdist-normalize
          mkdir -p dist
          SOURCE_DATE_EPOCH=1787702400 python -m pip wheel . --no-deps --no-build-isolation -w dist
          SOURCE_DATE_EPOCH=1787702400 python - <<'PY'
          from setuptools.build_meta import build_sdist
          build_sdist('dist')
          PY
          mkdir -p .sdist-normalize
          tar -xzf dist/dockrift-1.0.0.tar.gz -C .sdist-normalize
          rm dist/dockrift-1.0.0.tar.gz
          (
            cd .sdist-normalize
            LC_ALL=C tar \
              --sort=name \
              --mtime='@1787702400' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --format=gnu \
              -cf - dockrift-1.0.0
          ) | gzip -n > dist/dockrift-1.0.0.tar.gz
          rm -rf .sdist-normalize
          sha256sum dist/* | sed 's#dist/##' | tee dist/SHA256SUMS.txt
      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: dockrift-v1.0.0-release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
